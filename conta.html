<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minha conta – Korboly</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EFEBE3">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter+Tight:wght@500;600&display=swap">
<link rel="stylesheet" href="css/ui.css">
<style>
header{display:flex;justify-content:space-between;align-items:center;padding:0 clamp(16px,3vw,32px);height:72px;border-bottom:1px solid var(--line)}
.back{color:var(--muted)}.back:hover{color:var(--ink)}
main{max-width:1060px;margin:0 auto;padding:clamp(28px,6vw,64px) clamp(16px,4vw,32px) 80px}
.auth{max-width:420px;margin:0 auto}.auth h1{font-size:40px;margin:0 0 8px}.auth p.sub{color:var(--muted);margin:0 0 32px}
.alt{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 20px;margin-top:22px;color:var(--muted);font-size:14px}
.alt a,.alt button{border-bottom:1px solid var(--line2)}.alt a:hover,.alt button:hover{color:var(--ink)}
.dash{display:grid;grid-template-columns:220px 1fr;gap:clamp(24px,5vw,64px)}
@media(max-width:760px){.dash{grid-template-columns:1fr}}
.side h1{font-size:34px;margin:0 0 4px}.side .em{color:var(--muted);font-size:13px;margin:0 0 24px;word-break:break-all}
.nav{display:flex;flex-direction:column;border-top:1px solid var(--line)}
@media(max-width:760px){.nav{flex-direction:row;overflow-x:auto;border-top:0;border-bottom:1px solid var(--line)}.nav button{white-space:nowrap}}
.nav button{text-align:left;padding:14px 0;border-bottom:1px solid var(--line);color:var(--muted);transition:color .2s,padding .3s var(--ease)}
@media(max-width:760px){.nav button{padding:14px 16px 14px 0;border-bottom:0}}
.nav button:hover,.nav button.on{color:var(--ink)}.nav button.on{padding-left:8px}
@media(max-width:760px){.nav button.on{padding-left:0;border-bottom:1px solid var(--ink)}}
.pane h2{font-size:32px;margin:0 0 24px}
.card{border:1px solid var(--line);background:var(--sheet);padding:22px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:22px}
.ord{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.items{margin:10px 0 0;padding:0;list-style:none;color:var(--muted);font-size:14px}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
.quick button{border:1px solid var(--line);padding:18px;text-align:left;transition:border-color .25s}.quick button:hover{border-color:var(--accent)}
.hide{display:none!important}
</style>
</head>
<body>
<header><a href="index.html" class="back lbl">← Voltar à loja</a><a href="index.html" class="logo"><img src="img/logo.svg" alt="Korboly" width="715" height="160"></a><span style="width:100px"></span></header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div class="grain"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/sb.js"></script>
<script>
(function(){
var app=document.getElementById('app'),toastEl=document.getElementById('toast'),tt;
function toast(m,err){toastEl.textContent=m;toastEl.className='toast on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(function(){toastEl.className='toast'},3800)}
function $(s,r){return (r||app).querySelector(s)}
function msg(el,t,ok){el.className='msg '+(ok?'ok':'err');el.textContent=t||''}
function traduz(e){var m=(e&&e.message||'').toLowerCase();
 if(m.indexOf('invalid login')>-1)return 'E-mail ou senha incorretos.';
 if(m.indexOf('already registered')>-1||m.indexOf('already been registered')>-1)return 'Já existe uma conta com este e-mail.';
 if(m.indexOf('email not confirmed')>-1)return 'Confirme seu e-mail antes de entrar. Verifique a caixa de entrada.';
 if(m.indexOf('rate limit')>-1||m.indexOf('too many')>-1)return 'Muitas tentativas. Aguarde alguns minutos.';
 if(m.indexOf('password')>-1&&m.indexOf('least')>-1)return 'A senha precisa ter pelo menos 8 caracteres.';
 if(m.indexOf('same password')>-1)return 'A nova senha deve ser diferente da atual.';
 return 'Não foi possível concluir. Tente novamente.'}
function pwOk(p){return p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p)}
var emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

if(!window.KB_READY||!window.sb){app.innerHTML='<div class="noconf"><h1 class="serif" style="font-size:36px">Em configuração</h1><p class="muted">A área de conta ainda não foi conectada ao banco de dados. Preencha <code>js/config.js</code> com os dados do Supabase.</p></div>';return}

var fails=0,lock=0,user=null,profile=null;

/* ---------------- Telas de acesso ---------------- */
function viewLogin(){
 app.innerHTML='<div class="auth"><h1 class="serif">Entrar</h1><p class="sub">Acesse sua conta Korboly.</p><form id="f" novalidate>'+
 '<label class="fld"><span class="lbl">E-mail</span><input name="email" type="email" autocomplete="email" required></label>'+
 '<label class="fld"><span class="lbl">Senha</span><input name="pw" type="password" autocomplete="current-password" required></label>'+
 '<p class="msg" id="m" role="alert"></p><button class="btn solid" style="width:100%" id="go">Entrar na minha conta</button></form>'+
 '<div class="alt"><button id="rec" type="button">Esqueci minha senha</button><button id="cad" type="button">Criar uma conta</button></div></div>';
 $('#cad').onclick=viewSignup;$('#rec').onclick=viewRecover;
 $('#f').onsubmit=async function(e){e.preventDefault();var m=$('#m'),b=$('#go'),f=e.target;
  var email=f.email.value.trim().toLowerCase(),pw=f.pw.value;
  if(Date.now()<lock){return msg(m,'Muitas tentativas. Aguarde '+Math.ceil((lock-Date.now())/1000)+'s.')}
  if(!emailRe.test(email)||!pw)return msg(m,'Informe e-mail e senha.');
  b.disabled=true;msg(m,'');
  var r=await sb.auth.signInWithPassword({email:email,password:pw});b.disabled=false;
  if(r.error){fails++;if(fails>=5){lock=Date.now()+60000;fails=0}return msg(m,traduz(r.error))}
  fails=0;boot()}
}
function viewSignup(){
 app.innerHTML='<div class="auth"><h1 class="serif">Criar conta</h1><p class="sub">Acompanhe seus pedidos e compre com mais rapidez.</p><form id="f" novalidate>'+
 '<label class="fld"><span class="lbl">Nome completo</span><input name="nome" autocomplete="name" maxlength="120" required></label>'+
 '<label class="fld"><span class="lbl">E-mail</span><input name="email" type="email" autocomplete="email" required></label>'+
 '<label class="fld"><span class="lbl">Telefone (opcional)</span><input name="tel" type="tel" autocomplete="tel" maxlength="20" placeholder="(11) 90000-0000"></label>'+
 '<div class="row2"><label class="fld"><span class="lbl">Senha</span><input name="pw" type="password" autocomplete="new-password" required></label>'+
 '<label class="fld"><span class="lbl">Confirmar senha</span><input name="pw2" type="password" autocomplete="new-password" required></label></div>'+
 '<p class="muted" style="font-size:13px;margin:-6px 0 18px">Mínimo de 8 caracteres, com letras e números.</p>'+
 '<p class="msg" id="m" role="alert"></p><button class="btn solid" style="width:100%" id="go">Criar minha conta</button></form>'+
 '<div class="alt"><button id="lg" type="button">Já tenho conta</button></div></div>';
 $('#lg').onclick=viewLogin;
 $('#f').onsubmit=async function(e){e.preventDefault();var m=$('#m'),b=$('#go'),f=e.target;
  var nome=f.nome.value.trim().replace(/\s+/g,' '),email=f.email.value.trim().toLowerCase(),tel=f.tel.value.trim(),pw=f.pw.value;
  if(nome.split(' ').length<2||nome.length<5)return msg(m,'Informe seu nome completo.');
  if(!emailRe.test(email))return msg(m,'E-mail inválido.');
  if(tel&&!/^[\d\s()+-]{8,20}$/.test(tel))return msg(m,'Telefone inválido.');
  if(!pwOk(pw))return msg(m,'A senha precisa de 8+ caracteres, com letras e números.');
  if(pw!==f.pw2.value)return msg(m,'As senhas não conferem.');
  b.disabled=true;msg(m,'');
  var r=await sb.auth.signUp({email:email,password:pw,options:{data:{full_name:nome,phone:tel},emailRedirectTo:location.origin+location.pathname}});b.disabled=false;
  if(r.error)return msg(m,traduz(r.error));
  // e-mail já cadastrado: o Supabase devolve usuário sem identidades (não revela a existência por segurança)
  if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)return msg(m,'Já existe uma conta com este e-mail.');
  if(r.data.session){boot();return}
  app.innerHTML='<div class="auth" style="text-align:center"><h1 class="serif">Confirme seu e-mail</h1><p class="sub">Enviamos um link para <b>'+esc(email)+'</b>. Clique nele para ativar sua conta e depois entre.</p><button class="btn" id="lg">Ir para o login</button></div>';$('#lg').onclick=viewLogin}
}
function viewRecover(){
 app.innerHTML='<div class="auth"><h1 class="serif">Recuperar senha</h1><p class="sub">Enviaremos um link para você criar uma nova senha.</p><form id="f" novalidate>'+
 '<label class="fld"><span class="lbl">E-mail</span><input name="email" type="email" autocomplete="email" required></label><p class="msg" id="m" role="alert"></p>'+
 '<button class="btn solid" style="width:100%" id="go">Enviar link</button></form><div class="alt"><button id="lg" type="button">Voltar ao login</button></div></div>';
 $('#lg').onclick=viewLogin;
 $('#f').onsubmit=async function(e){e.preventDefault();var m=$('#m'),b=$('#go'),email=e.target.email.value.trim().toLowerCase();
  if(!emailRe.test(email))return msg(m,'E-mail inválido.');b.disabled=true;
  await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});b.disabled=false;
  msg(m,'Se este e-mail tiver cadastro, você receberá o link em instantes.',true)}
}
function viewReset(){
 app.innerHTML='<div class="auth"><h1 class="serif">Nova senha</h1><p class="sub">Escolha uma nova senha para sua conta.</p><form id="f" novalidate>'+
 '<label class="fld"><span class="lbl">Nova senha</span><input name="pw" type="password" autocomplete="new-password" required></label>'+
 '<label class="fld"><span class="lbl">Confirmar nova senha</span><input name="pw2" type="password" autocomplete="new-password" required></label>'+
 '<p class="msg" id="m" role="alert"></p><button class="btn solid" style="width:100%" id="go">Salvar nova senha</button></form></div>';
 $('#f').onsubmit=async function(e){e.preventDefault();var m=$('#m'),f=e.target;
  if(!pwOk(f.pw.value))return msg(m,'A senha precisa de 8+ caracteres, com letras e números.');
  if(f.pw.value!==f.pw2.value)return msg(m,'As senhas não conferem.');
  var r=await sb.auth.updateUser({password:f.pw.value});if(r.error)return msg(m,traduz(r.error));
  history.replaceState(null,'',location.pathname);toast('Senha alterada.');boot()}
}

/* ---------------- Área do cliente ---------------- */
var tab='geral';
function shell(){
 var first=(profile.full_name||'').split(' ')[0]||'cliente';
 app.innerHTML='<div class="dash"><aside class="side"><h1 class="serif">Olá, '+esc(first)+'</h1><p class="em">'+esc(user.email)+'</p>'+
 '<nav class="nav lbl" id="nav"></nav>'+
 '<div style="margin-top:24px;display:flex;flex-direction:column;gap:12px">'+(profile.role==='admin'?'<a class="btn sm" href="admin/">Painel admin</a>':'')+'<button class="btn sm" id="out">Sair da conta</button></div></aside><section class="pane" id="pane"></section></div>';
 var tabs=[['geral','Visão geral'],['pedidos','Meus pedidos'],['dados','Meus dados'],['enderecos','Meus endereços'],['seguranca','Segurança']];
 $('#nav').innerHTML=tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>'}).join('');
 $('#nav').onclick=function(e){var b=e.target.closest('button');if(b){tab=b.dataset.t;shell();render()}};
 $('#out').onclick=async function(){await sb.auth.signOut();user=null;viewLogin()}
}
async function render(){var p=$('#pane');p.innerHTML='<p class="muted">Carregando…</p>';
 try{await({geral:vGeral,pedidos:vPedidos,dados:vDados,enderecos:vEnd,seguranca:vSeg})[tab](p)}catch(e){p.innerHTML='<p class="msg err">Não foi possível carregar. Atualize a página.</p>'}}

async function loadOrders(limit){
 var r=await sb.from('orders').select('id,number,status,payment_status,total_cents,tracking_code,created_at,order_items(product_name,quantity)').order('created_at',{ascending:false}).limit(limit||100);
 if(r.error)throw r.error;return r.data}
function orderCard(o){
 var its=(o.order_items||[]).map(function(i){return '<li>'+esc(i.quantity)+'× '+esc(i.product_name)+'</li>'}).join('');
 var st=o.status==='cancelado'?'err':(o.status==='entregue'?'ok':'');
 return '<div class="card"><div class="ord"><div><h3 class="serif">Pedido #'+o.number+'</h3><span class="muted" style="font-size:13px">'+dt(o.created_at)+'</span></div><div style="text-align:right"><b>'+brl(o.total_cents)+'</b></div></div>'+
 '<ul class="items">'+its+'</ul><div class="kv"><span class="tag '+(o.payment_status==='pago'?'ok':(o.payment_status==='recusado'?'err':''))+'">Pagamento: '+esc(PAY[o.payment_status]||o.payment_status)+'</span><span class="tag '+st+'">Envio: '+esc(STATUS[o.status]||o.status)+'</span>'+
 (o.tracking_code?'<span class="tag">Rastreio: '+esc(o.tracking_code)+'</span>':'')+'</div></div>'}
async function vGeral(p){
 var os=await loadOrders(3);
 p.innerHTML='<h2 class="serif">Visão geral</h2><h3 class="lbl muted" style="margin:0 0 14px">Últimos pedidos</h3>'+
  (os.length?os.map(orderCard).join(''):'<div class="card"><p class="muted" style="margin:0 0 14px">Você ainda não fez nenhum pedido.</p><a class="btn sm" href="index.html">Conhecer as fragrâncias</a></div>')+
  '<div class="quick lbl"><button data-t="pedidos">Meus pedidos</button><button data-t="dados">Meus dados</button><button data-t="enderecos">Endereços</button><button data-t="seguranca">Segurança</button></div>';
 p.querySelector('.quick').onclick=function(e){var b=e.target.closest('button');if(b){tab=b.dataset.t;shell();render()}}}
async function vPedidos(p){var os=await loadOrders();
 p.innerHTML='<h2 class="serif">Meus pedidos</h2>'+(os.length?os.map(orderCard).join(''):'<p class="muted">Nenhum pedido ainda.</p>')}

async function vDados(p){
 p.innerHTML='<h2 class="serif">Meus dados</h2><form id="f" class="card" novalidate><label class="fld"><span class="lbl">Nome completo</span><input name="nome" maxlength="120" value="'+esc(profile.full_name)+'" required></label>'+
 '<label class="fld"><span class="lbl">Telefone</span><input name="tel" type="tel" maxlength="20" value="'+esc(profile.phone||'')+'"></label><p class="msg" id="m"></p><button class="btn solid">Salvar dados</button></form>'+
 '<form id="g" class="card" novalidate><label class="fld"><span class="lbl">E-mail</span><input name="email" type="email" value="'+esc(user.email)+'" required></label>'+
 '<p class="muted" style="font-size:13px;margin:-6px 0 16px">Ao alterar, enviaremos um link de confirmação para o novo e-mail.</p><p class="msg" id="m2"></p><button class="btn">Alterar e-mail</button></form>';
 $('#f').onsubmit=async function(e){e.preventDefault();var m=$('#m'),f=e.target,nome=f.nome.value.trim().replace(/\s+/g,' '),tel=f.tel.value.trim();
  if(nome.length<3)return msg(m,'Informe seu nome.');if(tel&&!/^[\d\s()+-]{8,20}$/.test(tel))return msg(m,'Telefone inválido.');
  var r=await sb.from('profiles').update({full_name:nome,phone:tel||null}).eq('id',user.id);
  if(r.error)return msg(m,'Não foi possível salvar.');profile.full_name=nome;profile.phone=tel||null;msg(m,'Dados salvos.',true);shell();$('#nav [data-t=dados]').click()};
 $('#g').onsubmit=async function(e){e.preventDefault();var m=$('#m2'),em=e.target.email.value.trim().toLowerCase();
  if(!emailRe.test(em))return msg(m,'E-mail inválido.');if(em===user.email)return msg(m,'Este já é o seu e-mail.');
  var r=await sb.auth.updateUser({email:em},{emailRedirectTo:location.origin+location.pathname});
  if(r.error)return msg(m,traduz(r.error));msg(m,'Enviamos um link de confirmação. O e-mail só muda depois que você confirmar.',true)}}

async function vEnd(p){
 var r=await sb.from('addresses').select('*').order('is_default',{ascending:false}).order('created_at');if(r.error)throw r.error;
 p.innerHTML='<h2 class="serif">Meus endereços</h2>'+(r.data.length?r.data.map(function(a){
  return '<div class="card"><div class="ord"><div><b>'+esc(a.label||a.recipient)+'</b> '+(a.is_default?'<span class="tag ok">Principal</span>':'')+
  '<p class="muted" style="margin:8px 0 0">'+esc(a.recipient)+'<br>'+esc(a.street)+', '+esc(a.number)+(a.complement?' – '+esc(a.complement):'')+'<br>'+esc(a.district)+' · '+esc(a.city)+'/'+esc(a.state)+' · CEP '+esc(a.zip)+'</p></div>'+
  '<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap"><button class="btn sm" data-ed="'+a.id+'">Editar</button>'+(a.is_default?'':'<button class="btn sm" data-pr="'+a.id+'">Tornar principal</button>')+'<button class="btn sm danger" data-del="'+a.id+'">Excluir</button></div></div></div>'}).join(''):'<p class="muted">Nenhum endereço cadastrado.</p>')+
  '<button class="btn" id="add" style="margin-top:8px">Adicionar endereço</button>';
 var list=r.data;
 $('#add').onclick=function(){formEnd(null,list.length===0)};
 p.onclick=async function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.ed)formEnd(list.find(function(x){return x.id===b.dataset.ed}));
  if(b.dataset.pr){await sb.from('addresses').update({is_default:false}).eq('user_id',user.id);await sb.from('addresses').update({is_default:true}).eq('id',b.dataset.pr);toast('Endereço principal atualizado.');render()}
  if(b.dataset.del&&confirm('Excluir este endereço?')){var d=await sb.from('addresses').delete().eq('id',b.dataset.del);if(d.error)toast('Não foi possível excluir.',1);else{toast('Endereço excluído.');render()}}}}
function formEnd(a,isFirst){a=a||{};var p=$('#pane');
 p.onclick=null;
 p.innerHTML='<h2 class="serif">'+(a.id?'Editar endereço':'Novo endereço')+'</h2><form id="f" class="card" novalidate>'+
 '<label class="fld"><span class="lbl">Apelido (casa, trabalho…)</span><input name="label" maxlength="40" value="'+esc(a.label||'')+'"></label>'+
 '<label class="fld"><span class="lbl">Nome de quem recebe</span><input name="recipient" maxlength="120" value="'+esc(a.recipient||profile.full_name||'')+'" required></label>'+
 '<div class="row2"><label class="fld"><span class="lbl">CEP</span><input name="zip" inputmode="numeric" maxlength="9" value="'+esc(a.zip||'')+'" required></label><span></span></div>'+
 '<label class="fld"><span class="lbl">Rua</span><input name="street" maxlength="120" value="'+esc(a.street||'')+'" required></label>'+
 '<div class="row2"><label class="fld"><span class="lbl">Número</span><input name="number" maxlength="12" value="'+esc(a.number||'')+'" required></label><label class="fld"><span class="lbl">Complemento</span><input name="complement" maxlength="60" value="'+esc(a.complement||'')+'"></label></div>'+
 '<label class="fld"><span class="lbl">Bairro</span><input name="district" maxlength="80" value="'+esc(a.district||'')+'" required></label>'+
 '<div class="row2"><label class="fld"><span class="lbl">Cidade</span><input name="city" maxlength="80" value="'+esc(a.city||'')+'" required></label><label class="fld"><span class="lbl">UF</span><input name="state" maxlength="2" value="'+esc(a.state||'')+'" style="text-transform:uppercase" required></label></div>'+
 '<label class="fld" style="display:flex;gap:10px;align-items:center"><input type="checkbox" name="def" style="width:auto"'+((a.is_default||isFirst)?' checked':'')+'><span class="lbl" style="margin:0">Endereço principal</span></label>'+
 '<p class="msg" id="m"></p><div style="display:flex;gap:10px"><button class="btn solid">Salvar</button><button type="button" class="btn" id="cn">Cancelar</button></div></form>';
 $('#cn').onclick=render;
 $('#f').onsubmit=async function(e){e.preventDefault();var f=e.target,m=$('#m');
  var row={label:f.label.value.trim()||null,recipient:f.recipient.value.trim(),zip:f.zip.value.trim(),street:f.street.value.trim(),number:f.number.value.trim(),complement:f.complement.value.trim()||null,district:f.district.value.trim(),city:f.city.value.trim(),state:f.state.value.trim().toUpperCase()};
  if(!/^\d{5}-?\d{3}$/.test(row.zip))return msg(m,'CEP inválido.');
  if(!row.recipient||!row.street||!row.number||!row.district||!row.city||!/^[A-Z]{2}$/.test(row.state))return msg(m,'Preencha todos os campos obrigatórios.');
  var wantDef=f.def.checked;
  if(wantDef)await sb.from('addresses').update({is_default:false}).eq('user_id',user.id);
  row.is_default=wantDef;
  var r=a.id?await sb.from('addresses').update(row).eq('id',a.id):await sb.from('addresses').insert(Object.assign({user_id:user.id},row));
  if(r.error)return msg(m,'Não foi possível salvar o endereço.');toast('Endereço salvo.');render()}}

async function vSeg(p){
 p.innerHTML='<h2 class="serif">Segurança</h2><form id="f" class="card" novalidate><h3 class="serif">Alterar senha</h3><br>'+
 '<label class="fld"><span class="lbl">Nova senha</span><input name="pw" type="password" autocomplete="new-password" required></label>'+
 '<label class="fld"><span class="lbl">Confirmar nova senha</span><input name="pw2" type="password" autocomplete="new-password" required></label><p class="msg" id="m"></p><button class="btn solid">Alterar senha</button></form>'+
 '<div class="card"><h3 class="serif">Sessões</h3><p class="muted">Encerre o acesso em todos os dispositivos onde você entrou.</p><button class="btn" id="all">Sair de todos os dispositivos</button></div>'+
 '<p class="muted" style="font-size:13px">Seus dados pessoais ficam protegidos no servidor: somente você (e a equipe Korboly, para atender seus pedidos) consegue acessá-los.</p>';
 $('#f').onsubmit=async function(e){e.preventDefault();var m=$('#m'),f=e.target;
  if(!pwOk(f.pw.value))return msg(m,'A senha precisa de 8+ caracteres, com letras e números.');if(f.pw.value!==f.pw2.value)return msg(m,'As senhas não conferem.');
  var r=await sb.auth.updateUser({password:f.pw.value});if(r.error)return msg(m,traduz(r.error));f.reset();msg(m,'Senha alterada com sucesso.',true)};
 $('#all').onclick=async function(){await sb.auth.signOut({scope:'global'});user=null;viewLogin()}}

/* ---------------- Início ---------------- */
async function boot(){
 var s=await sb.auth.getSession();user=s.data.session&&s.data.session.user;
 if(!user){var q=location.hash+location.search;viewLogin();if(/mode=signup/.test(q))viewSignup();return}
 var r=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(r.error){app.innerHTML='<div class="noconf"><p class="muted">Não foi possível carregar sua conta.</p></div>';return}
 profile=r.data;shell();render()}
sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY')viewReset()});
if(/type=recovery/.test(location.hash))setTimeout(viewReset,0);else boot();
})();
</script>
</body></html>
