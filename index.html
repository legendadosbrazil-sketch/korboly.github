<style>
:root{--paper:#EFEBE3;--sheet:#F6F3EC;--alt:#E4DFD3;--ink:#1D2C78;--muted:#555D8C;--accent:#A64F27;--rule:rgba(29,44,120,.55);--line:rgba(29,44,120,.16);--line2:rgba(29,44,120,.24);--ph:#DDD7C9;--ease:cubic-bezier(.2,.8,.2,1);--H:max(130px,min(62vh,38vw,calc(100svh - 300px)))}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;line-height:1.5}
.hero{user-select:none;-webkit-user-select:none}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.lbl{font-weight:600;font-size:10.5px;line-height:1;letter-spacing:.09em;text-transform:uppercase}
.box{display:inline-flex;align-items:center;height:21px;padding:0 8px;border:1px solid var(--rule)}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400}
.fx{position:fixed}.ab{position:absolute}
/* grain */
.grain{position:fixed;inset:0;z-index:40;pointer-events:none;mix-blend-mode:multiply;opacity:.35;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2 0 0 0 0 .22 0 0 0 0 .4 0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.glow{position:absolute;inset:0;pointer-events:none;background:none}
/* top bar */
.top{top:0;left:0;right:0;height:84px;border-bottom:1px solid transparent;transition:background .3s,border-color .3s;padding:0 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;z-index:30}
.top.sc,.top.open{background:rgba(239,235,227,.94);border-color:var(--line)}
.tl{display:flex;gap:28px;align-items:center}.tn{display:flex;gap:28px}.tn a:hover{color:var(--accent)}.mb{display:none}
.top>:first-child{justify-self:start}.top>:last-child{justify-self:end}
.logo{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.logo img{display:block;width:152px;height:auto}
.flog{align-items:flex-start}.flog img{width:168px}
.dl .logo img{width:200px}
.logo b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:24px;letter-spacing:.34em;padding-left:.34em;line-height:1}
.logo i{font-style:normal;font-weight:600;font-size:8.5px;letter-spacing:.34em;padding-left:.34em;color:var(--muted)}
.acts{display:flex;align-items:center;gap:14px}.acc{display:inline-grid;place-items:center;width:28px;height:28px;color:var(--ink);transition:color .2s}.acc:hover{color:var(--accent)}
/* tabs */
.tabs{left:50%;top:max(96px,calc(50% - var(--Hp)/2 - 86px));transform:translateX(-50%);display:flex;z-index:30}
.tabs .t{position:relative;z-index:1;height:23px;padding:0 11px;border:1px solid var(--rule);margin-left:-1px;white-space:nowrap;display:flex;align-items:center;transition:color .45s var(--ease)}
.tabs .t:first-of-type{margin-left:0}
.tabs .t.on{color:var(--paper)}
.ind{position:absolute;left:0;top:0;height:23px;background:var(--ink);z-index:0;transition:width .6s var(--ease),transform .6s var(--ease)}
/* shelf */
.shelf{left:0;right:0;top:calc(50% - var(--Hp)/2 - 40px);height:calc(var(--Hp) + 80px);perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y;z-index:10}
.stage{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.tape{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.pl{position:absolute;left:calc(var(--d)/-2);top:calc(var(--Hp)/-2);width:var(--d);height:var(--Hp);background:var(--ph) center/cover no-repeat;border:1px solid var(--line2);border-radius:3px;overflow:hidden;box-shadow:0 40px 70px -30px rgba(29,44,120,.3);display:flex;align-items:flex-end;padding:14px;color:var(--muted);font-size:11px;line-height:1.4;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pl::after{content:"";position:absolute;inset:0;background:var(--paper);opacity:var(--shade,0);pointer-events:none}
.flr{left:50%;top:calc(50% + var(--Hp)/2 + 16px);width:min(86vw,900px);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--line2) 20%,var(--line2) 80%,transparent);z-index:5;pointer-events:none}
/* play ring */
.play{width:42px;height:42px;border-radius:50%;border:1px solid var(--accent);background:rgba(239,235,227,.85);display:grid;place-items:center;z-index:35;transform:scale(0);margin:-21px 0 0 -21px}
.play::before{content:"";border-left:12px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
/* caption */
.cap{left:50%;top:calc(50% + var(--Hp)/2 + 30px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none;z-index:20}
.ln{position:relative;overflow:hidden;width:min(92vw,760px);text-align:center}
.ln span{display:block;white-space:nowrap}
.ln span+span,.ln.sw span{position:absolute;left:0;right:0;top:0}

.arr.l{left:20px}.arr.r{right:20px}
.foot{left:32px;right:32px;bottom:26px;display:flex;justify-content:space-between;z-index:30}
.foot a:hover{color:var(--accent)}
/* cursor */
.cur{position:fixed;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;z-index:100;pointer-events:none;display:none}

.cur .ring{position:absolute;inset:0;border:1.5px solid var(--ink);border-radius:50%;transition:transform .5s var(--ease),background-color .4s var(--ease),border-color .4s var(--ease)}
.cur .dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--ink);transition:transform .4s var(--ease)}
.cur .tx{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:600;font-size:10px;line-height:1.25;letter-spacing:.1em;color:var(--paper);transform:scale(0);transition:transform .45s var(--ease)}
.cur.spine .ring{transform:scale(.72)}
.cur.btn .ring{transform:scale(.55)}.cur.btn .dot{transform:scale(0)}
.cur.open .ring{transform:scale(1.75);background:var(--ink)}.cur.open .dot{transform:scale(0)}.cur.open .tx{transform:scale(1)}

.detail{position:fixed;inset:0;z-index:60;background:var(--sheet);visibility:hidden;display:grid;grid-template-columns:1fr 1fr;gap:4vw;padding:110px 6vw 56px 7vw;overflow:hidden}
.detail .cls{position:absolute;left:32px;top:31px;z-index:5}
.detail .dl{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;justify-content:center}
.dl{pointer-events:none}.dl .logo{pointer-events:none}
.dtx{align-self:center;max-width:520px;display:flex;flex-direction:column;gap:18px}
.m{overflow:hidden;padding-bottom:4px}.m>*{display:block;will-change:transform}
.d1{color:var(--accent)}
.d2{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(44px,5.4vw,84px);line-height:1;letter-spacing:-.025em}
.d3{color:var(--muted)}
.d4{font-family:"Cormorant Garamond",serif;font-size:19px;line-height:1.5;max-width:42ch;color:var(--ink)}
.d5{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16px;color:var(--muted)}
.buy{display:inline-flex;align-items:center;height:44px;padding:0 20px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);margin-top:10px;transition:background .25s,color .25s}
.buy:hover{background:var(--accent);border-color:var(--accent)}
.pst{align-self:center;justify-self:center;height:min(100%,78vh);aspect-ratio:474/900}
.pst svg{width:100%;height:100%;display:block}

<svg viewBox="0 0 474 900" preserveAspectRatio="xMidYMid meet">
<defs>
<clipPath id="pc"><rect width="474" height="900"/></clipPath>
<filter id="ink" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/></filter>
<mask id="pm" maskUnits="userSpaceOnUse" x="-200" y="-200" width="874" height="1300"><g filter="url(#ink)" fill="#fff" id="blobs"></g></mask>
</defs>
<g mask="url(#pm)"><g clip-path="url(#pc)"><rect width="474" height="900" fill="#DDD7C9"/><image id="pimg" width="474" height="900" preserveAspectRatio="xMidYMid slice"/><text id="pph" x="237" y="450" text-anchor="middle" fill="#555D8C" font-size="16" font-family="Inter Tight,sans-serif"></text></g></g>

<script>document.documentElement.className+=' js'</script>
<script>
(function(){
var IMG="img/dark-luxury.webp";var IMG_E="img/evora.webp";var IMG_H="img/haitz.webp";
var FILMS=[
{id:'dark',name:'Dark Luxury',vol:'100 ML',price:'R$ 229,90',url:'#contato',photo:IMG},
{id:'evora',name:'Évora',vol:'60 ML',price:'R$ 169,90',url:'#contato',photo:IMG_E},
{id:'haitz',name:'Haitz',vol:'60 ML',price:'R$ 179,90',url:'#contato',photo:IMG_H}
];
var DESC='[Descrição sensorial curta]';
var N=FILMS.length,COPIES=1,M=N*COPIES;
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
var $=function(i){return document.getElementById(i)};
var hero=$('hero'),stage=$('stage'),shelf=$('shelf'),cur=$('cur'),play=$('play'),detail=$('detail'),ind=$('ind');
var W=innerWidth,Hh=innerHeight,H=300,ws,d,gap;
function ss(x){return x*x*(3-2*x)}
function B(r){return Math.abs(r)<1?(r+Math.sin(Math.PI*r)/Math.PI)/2:(r>0?.5:-.5)}
function measure(){
var p=document.createElement('div');p.style.cssText='position:absolute;visibility:hidden;height:var(--H);width:1px';document.body.appendChild(p);
H=p.getBoundingClientRect().height;p.remove();
ws=H*142/840;d=H*474/900;gap=H*.03;W=innerWidth;Hh=innerHeight;
var r=document.documentElement.style;
r.setProperty('--Hp',H+'px');
stage.style.setProperty('--ws',ws+'px');stage.style.setProperty('--d',d+'px');stage.style.setProperty('--Hp',H+'px');
document.querySelectorAll('.tabs,.shelf').forEach(function(e){e.style.setProperty('--Hp',H+'px')});
['cap','pv','nx'].forEach(function(i){$(i).style.setProperty('--Hp',H+'px')});
placeInd();
}
/* tabs */
var tabEls=FILMS.map(function(f,i){var b=document.createElement('button');b.className='t lbl';b.type='button';b.textContent=f.name;b.addEventListener('click',function(){goTo(i)});$('tabs').appendChild(b);return b});
function placeInd(){var t=tabEls[active];if(!t)return;ind.style.width=t.offsetWidth+'px';ind.style.transform='translateX('+t.offsetLeft+'px)'}
/* plates */
var tapes=[];
for(var v=0;v<M;v++){
var f=FILMS[v%N];
var el=document.createElement('div');el.className='tape';
var cv=document.createElement('div');cv.className='pl';
if(f.photo){cv.style.backgroundImage='url('+f.photo+')';cv.setAttribute('role','img');cv.setAttribute('aria-label',f.name)}else{cv.textContent='[Foto real do frasco: '+f.name+']'}
el.appendChild(cv);stage.appendChild(el);
tapes.push({el:el,cv:cv,v:v,film:v%N,lift:0,liftT:0,r:0});
(function(t){
el.addEventListener('pointerenter',function(){hover=t.v});
el.addEventListener('pointerleave',function(){if(hover===t.v)hover=-1});
el.addEventListener('click',function(){
if(wasDrag)return;
if(Math.abs(t.r)<.5){openDetail()}else{T=Math.round(T+t.r)}
});
})(tapes[v]);
}
/* state */
var s=N*2,T=s,hover=-1,active=0,mx=W/2,my=Hh/2,cx=mx,cy=my,tiltX=0,tiltY=0,onCover=false,isOpen=false,dragging=false,wasDrag=false,wheelTimer=0;
/* caption */
function swap(line,text,dir){
if(RM){line.innerHTML='';var s0=document.createElement('span');s0.textContent=text;line.appendChild(s0);return}
var n=document.createElement('span');n.textContent=text;
var olds=[].slice.call(line.children);
line.appendChild(n);
line.classList.add('sw');
var o={duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'};
n.animate([{transform:'translateY('+(dir*105)+'%)'},{transform:'translateY(0)'}],o);
olds.forEach(function(x){
if(x._leaving)return;x._leaving=1;
var cs=getComputedStyle(x).transform;
var a=x.animate([{transform:cs==='none'?'translateY(0)':cs},{transform:'translateY('+(-dir*105)+'%)'}],o);
a.onfinish=function(){x.remove()};
});
}
function setActive(i,dir){
active=i;var f=FILMS[i];
swap($('c1'),f.name,dir);swap($('c2'),f.vol+' / '+f.price,dir);swap($('c3'),'Frete grátis para todo o Brasil',dir);
tabEls.forEach(function(t,k){t.classList.toggle('on',k===i)});placeInd();
}
function goTo(i){
var cur0=((Math.round(T)%N)+N)%N,df=((i-cur0)%N+N)%N;if(df>N/2)df-=N;T=Math.round(T)+df;
}
shelf.addEventListener('click',function(e){
if(wasDrag||isOpen)return;
var r=coverRect();
if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom&&Math.abs(T-s)<.3)openDetail();
});
/* input */
$('pv').addEventListener('click',function(){T=Math.round(T)-1});
$('nx').addEventListener('click',function(){T=Math.round(T)+1});
play.addEventListener('click',openDetail);
[].slice.call(document.querySelectorAll('.pc[data-film]')).forEach(function(a){
a.addEventListener('click',function(e){
e.preventDefault();
var i=+a.getAttribute('data-film');
hero.scrollIntoView({behavior:'smooth',block:'start'});
T=i;
setTimeout(function(){T=i;openDetail()},RM?0:620);
});
});
addEventListener('keydown',function(e){
if(e.key==='Escape'&&isOpen){closeDetail();return}
if(isOpen)return;
if(hero.getBoundingClientRect().bottom<Hh*.5)return;
if(e.key==='ArrowLeft')T=Math.round(T)-1;
else if(e.key==='ArrowRight')T=Math.round(T)+1;
else if(e.key==='Enter'&&document.activeElement===document.body)openDetail();
});
addEventListener('wheel',function(e){
if(isOpen||Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
var dl=e.deltaX;
T+=dl/(ws+gap)*.5;clearTimeout(wheelTimer);wheelTimer=setTimeout(function(){T=Math.round(T)},160);
},{passive:true});
var sx0=0,T0=0,down=false;
shelf.addEventListener('pointerdown',function(e){down=true;wasDrag=false;sx0=e.clientX;T0=T});
addEventListener('pointermove',function(e){
mx=e.clientX;my=e.clientY;
if(down){var dx=e.clientX-sx0;if(!dragging&&Math.abs(dx)>5){dragging=true;wasDrag=true}if(dragging)T=T0-dx/(ws+gap)}
});
addEventListener('pointerup',function(){if(dragging){T=Math.round(T)}down=false;dragging=false;setTimeout(function(){wasDrag=false},0)});
addEventListener('pointercancel',function(){down=false;dragging=false});
addEventListener('resize',measure);
document.addEventListener('pointerover',function(e){
var b=e.target.closest&&e.target.closest('button,a');
cur.classList.toggle('btn',!!b&&!b.closest('#shelf'));
});
/* frame */
var last=performance.now();
function frame(t){
var dt=Math.min(.05,(t-last)/1000);last=t;
var hr=hero.getBoundingClientRect();
if(hr.bottom<-150||hr.top>Hh+150){requestAnimationFrame(frame);return}
var k=RM?1:(dragging?18:5.2);
s+=(T-s)*(1-Math.exp(-k*dt));if(Math.abs(T-s)<1e-4)s=T;
if(Math.abs(s)>M*4){var sh=Math.round(s/M)*M;s-=sh;T-=sh}
var idx=((Math.round(s)%N)+N)%N;
if(idx!==active){var dr=T-s>=0?1:-1;if(T===s)dr=1;setActive(idx,dr)}
onCover=!isOpen&&Math.abs(mx-W/2)<.55*d&&Math.abs(my-(hr.top+hr.height/2))<.55*H&&Math.abs(T-s)<.3;
var tkx=1-Math.exp(-7*dt);if(RM)tkx=1;
var tyT=onCover?(mx-W/2)/(.55*d)*9:(mx-W/2)/W*5,txT=onCover?-(my-(hr.top+hr.height/2))/(H/2)*6:0;
tiltY+=(tyT-tiltY)*tkx;tiltX+=(txT-tiltX)*tkx;
var lk=RM?1:1-Math.exp(-12*dt);
for(var i=0;i<M;i++){
var tp=tapes[i];
var r=(((tp.v-s)%M)+M)%M;if(r>M/2)r-=M;
tp.r=r;
tp.liftT=(hover===tp.v&&Math.abs(r)>.5&&!isOpen)?1:0;
tp.lift+=(tp.liftT-tp.lift)*lk;
var o=ss(Math.max(0,1-Math.abs(r)));
var rc=Math.max(-1.2,Math.min(1.2,r));
var x=r*d*1.14;
var ry=-rc*30*(1-o)+tiltY*o,rx=tiltX*o,rz=-2.5*o;
var tz=o*.22*H-(1-o)*.12*H,ty=-o*.03*H-tp.lift*.03*H;
tp.el.style.transform='translate3d('+x.toFixed(2)+'px,'+ty.toFixed(2)+'px,'+tz.toFixed(2)+'px) rotateZ('+rz.toFixed(3)+'deg) rotateX('+rx.toFixed(3)+'deg) rotateY('+ry.toFixed(3)+'deg)';
tp.el.style.zIndex=Math.round(100-Math.abs(r)*4);
tp.cv.style.setProperty('--shade',((1-o)*.55).toFixed(3));
}
var ps=isOpen?0:ss(Math.max(0,1-Math.abs(T-s)*3));
play.style.transform='scale('+ps.toFixed(3)+')';
play.style.left=(W/2-.5*d-6)+'px';play.style.top=(hr.height/2+.36*H)+'px';
var ck=1-Math.exp(-16*dt);cx+=(mx-cx)*ck;cy+=(my-cy)*ck;
cur.style.transform='translate3d('+cx.toFixed(1)+'px,'+cy.toFixed(1)+'px,0)';
var ov=false;if(!isOpen&&hover>=0){var h=tapes[hover];ov=Math.abs(h.r)>.5}
cur.classList.toggle('spine',ov&&!onCover);
cur.classList.toggle('open',onCover);
requestAnimationFrame(frame);
}
/* detail */
var blobs=[[150,330,0],[340,600,120],[250,120,220],[90,760,300],[400,250,360],[260,860,420],[230,470,180]];
var bg=$('blobs'),circles=blobs.map(function(b){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',b[0]);c.setAttribute('cy',b[1]);c.setAttribute('r',0);bg.appendChild(c);return c});
var masks=[].slice.call(detail.querySelectorAll('.m>*'));
var detAnim=null,inkRaf=0;
function coverRect(){var t=tapes.filter(function(x){return Math.abs(x.r)<.5})[0]||tapes[0];return t.cv.getBoundingClientRect()}
function inset(r){return 'inset('+r.top+'px '+(innerWidth-r.right)+'px '+(innerHeight-r.bottom)+'px '+r.left+'px round 3px)'}
function openDetail(){
if(isOpen)return;isOpen=true;T=Math.round(T);document.body.style.overflow='hidden';
var f=FILMS[active];
$('d1').textContent=f.vol+' / Korboly';$('d2').textContent=f.name;$('d3').textContent=f.vol+' / '+f.price;$('d4').textContent=DESC;$('d6').textContent='Comprar';$('d6').href=f.url;
var im=$('pimg'),ph=$('pph');
if(f.photo){im.setAttribute('href',f.photo);im.style.display='';ph.textContent=''}else{im.removeAttribute('href');im.style.display='none';ph.textContent='[Foto real do frasco: '+f.name+']'}
circles.forEach(function(c){c.setAttribute('r',0)});
var r=coverRect(),cxp=r.left+r.width/2,cyp=r.top+r.height/2;
detail.style.visibility='visible';detail.style.transformOrigin=cxp+'px '+cyp+'px';
var D=RM?1:1050,E='cubic-bezier(.76,0,.18,1)';
if(detAnim)detAnim.cancel();
detAnim=detail.animate([{clipPath:inset(r),transform:'rotate(-2.5deg)'},{clipPath:'inset(0px 0px 0px 0px round 0px)',transform:'rotate(0deg)'}],{duration:D,easing:E,fill:'both'});
masks.forEach(function(m,i){m.getAnimations().forEach(function(a){a.cancel()});m.animate([{transform:'translateY(110%)'},{transform:'translateY(0)'}],{duration:RM?1:900,delay:RM?0:620+i*75,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'})});
var t0=performance.now()+(RM?-5000:520);cancelAnimationFrame(inkRaf);
(function ink(now){
var el=now-t0,done=true;
circles.forEach(function(c,i){var p=Math.min(1,Math.max(0,(el-blobs[i][2])/1250));if(p<1)done=false;c.setAttribute('r',(720*(1-Math.pow(1-p,3))).toFixed(1))});
if(!done&&el<2400+blobs[6][2])inkRaf=requestAnimationFrame(ink);
})(performance.now());
}
function closeDetail(){
if(!isOpen)return;
var r=coverRect(),cxp=r.left+r.width/2,cyp=r.top+r.height/2;
detail.style.transformOrigin=cxp+'px '+cyp+'px';
if(detAnim)detAnim.cancel();
var a=detail.animate([{clipPath:'inset(0px 0px 0px 0px round 0px)',transform:'rotate(0deg)'},{clipPath:inset(r),transform:'rotate(-2.5deg)'}],{duration:RM?1:850,easing:'cubic-bezier(.76,0,.18,1)',fill:'both'});
detAnim=a;isOpen=false;
a.onfinish=function(){document.body.style.overflow='';detail.style.visibility='hidden';a.cancel();detAnim=null;cancelAnimationFrame(inkRaf)};
}
$('cls').addEventListener('click',closeDetail);
/* page */
document.querySelectorAll('[data-img]').forEach(function(e){e.style.backgroundImage='url('+IMG+')';if(e.hasAttribute('data-crop')){e.style.backgroundSize='230%';e.style.backgroundPosition='50% 40%'}});
var topEl=$('top'),mbEl=$('mb');
function sc(){topEl.classList.toggle('sc',scrollY>40)}sc();addEventListener('scroll',sc,{passive:true});
mbEl.addEventListener('click',function(){var o=topEl.classList.toggle('open');mbEl.setAttribute('aria-expanded',o)});
document.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener('click',function(e){
var tg=document.querySelector(a.getAttribute('href'));if(!tg)return;e.preventDefault();topEl.classList.remove('open');mbEl.setAttribute('aria-expanded','false');
tg.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})})});
var rvs=document.querySelectorAll('.rv');
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.12});rvs.forEach(function(x){io.observe(x)})}else{rvs.forEach(function(x){x.classList.add('in')})}
/* init */
measure();
document.fonts&&document.fonts.ready.then(measure);
setActive(active,1);
$('c1').innerHTML='';$('c2').innerHTML='';$('c3').innerHTML='';
(function(){var f=FILMS[active];[['c1',f.name],['c2',f.vol+' / '+f.price],['c3','Frete grátis para todo o Brasil']].forEach(function(p){var sp=document.createElement('span');sp.textContent=p[1];$(p[0]).innerHTML='';$(p[0]).appendChild(sp)})})();
requestAnimationFrame(frame);
})();
</script>
